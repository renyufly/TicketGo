server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The production runtime must resolve "ticketgo" to the Gin service.
    location ~ ^/(api|health)/ {
        proxy_pass http://ticketgo:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
}
